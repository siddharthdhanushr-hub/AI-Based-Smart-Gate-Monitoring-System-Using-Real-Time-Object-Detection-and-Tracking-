# YOLOv8 Dataset Configuration for Smart Gate Monitoring
# Paths relative to the dataset root directory (or absolute in Google Colab)

path: ../dataset  # dataset root dir
train: images/train  # train images (relative to 'path')
val: images/val      # val images (relative to 'path')
test: images/test    # test images (optional, relative to 'path')

# Number of classes
nc: 6

# Class names
names:
  0: person
  1: bicycle
  2: car
  3: motorcycle
  4: bus
  5: truck
